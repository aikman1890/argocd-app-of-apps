apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-workloads
  namespace: argocd
spec:
  project: default
  source:
    repoURL: CHANGE_ME_gitops_repo_url
    targetRevision: HEAD
    path: apps/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
